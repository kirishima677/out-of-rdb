[SERVICE]
    Flush        1
    Daemon       Off
    Log_Level    info

# Send exactly one record so the end-to-end sample is deterministic.
[INPUT]
    Name         dummy
    Tag          fluentbit.sample
    Dummy        {"message":"hello from Fluent Bit","service":"sample"}
    Samples      1

[OUTPUT]
    Name               s3
    Match              fluentbit.*
    Bucket             fluentbit-logs
    Region             us-east-1
    Endpoint           http://localstack:4566
    Use_Put_Object     On
    Upload_Timeout     5s
    Total_File_Size    1M
    S3_Key_Format      /logs/%Y/%m/%d/%H/%M/%S-$UUID.json
    Store_Dir          /buffers
    tls                Off
