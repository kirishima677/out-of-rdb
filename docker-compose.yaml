name: out-of-rdb-lab

networks:
  labnet:
    driver: bridge

volumes:
  mongo_data:
  redis_data:
  cassandra_data:
  cockroach_data:
  etcd_data:
  zookeeper_data:
  consul_data:
  clickhouse_data:
  clickhouse_logs:
  neo4j_data:
  neo4j_logs:
  neo4j_plugins:
  dynamodb_data:

services:
  # Simple client container to access other services on the same network
  client:
    build:
      context: ./client/docker
      dockerfile: Dockerfile
    image: out-of-rdb-client:latest
    container_name: client
    command: ["/bin/sh", "-c", "sleep infinity"]
    networks:
      - labnet
    volumes:
      - ./client:/workspace
    # Uncomment to set a default hostname for easier discovery
    # hostname: client

  # MongoDB (NoSQL - document store)
  mongodb:
    image: mongo:7
    container_name: mongodb
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=example
    volumes:
      - mongo_data:/data/db
    networks:
      - labnet

  # Redis (NoSQL - key/value)
  redis:
    image: redis:7
    container_name: redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6381:6379"
    volumes:
      - redis_data:/data
    networks:
      - labnet

  # Cassandra (NoSQL - wide column)
  cassandra:
    image: cassandra:4
    container_name: cassandra
    environment:
      - CASSANDRA_START_RPC=true
      - MAX_HEAP_SIZE=512M
      - HEAP_NEWSIZE=128M
    ports:
      - "9042:9042"   # CQL
    volumes:
      - cassandra_data:/var/lib/cassandra
    networks:
      - labnet

  # CockroachDB (NewSQL - distributed SQL)
  cockroachdb:
    image: cockroachdb/cockroach:v24.2.2
    container_name: cockroachdb
    command: ["start-single-node", "--insecure", "--http-addr=0.0.0.0:8080", "--sql-addr=0.0.0.0:26259"]
    ports:
      - "26258:26259" # SQL (host:container)
      - "8081:8080"   # Admin UI (host:container)
    volumes:
      - cockroach_data:/cockroach/cockroach-data
    networks:
      - labnet

  # etcd (Key-value store, often used for coordination)
  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    container_name: etcd
    command:
      - /usr/local/bin/etcd
      - --name=etcd
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd:2380
      - --initial-cluster=etcd=http://etcd:2380
      - --initial-cluster-token=docker-etcd
      - --initial-cluster-state=new
    ports:
      - "2379:2379"
      - "2380:2380"
    volumes:
      - etcd_data:/etcd-data
    networks:
      - labnet

  # ZooKeeper (coordination service)
  zookeeper:
    image: zookeeper:3.9
    container_name: zookeeper
    environment:
      ZOO_MY_ID: 1
    ports:
      - "2181:2181"
      - "2888:2888"
      - "3888:3888"
    volumes:
      - zookeeper_data:/bitnami/zookeeper
    networks:
      - labnet

  # Consul (service discovery / KV)
  consul:
    image: hashicorp/consul:1.19
    container_name: consul
    command: ["agent", "-dev", "-ui", "-client=0.0.0.0"]
    ports:
      - "8500:8500"   # HTTP/UI
      - "8600:8600/udp" # DNS
    volumes:
      - consul_data:/consul/data
    networks:
      - labnet

  # ClickHouse (Column-oriented OLAP database)
  clickhouse:
    image: clickhouse/clickhouse-server:24
    container_name: clickhouse
    ports:
      - "8123:8123"   # HTTP
      - "9000:9000"   # Native client
    environment:
      - CLICKHOUSE_DB=default
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
    networks:
      - labnet

  # Neo4j (Graph database)
  neo4j:
    image: neo4j:5
    container_name: neo4j
    environment:
      - NEO4J_AUTH=neo4j/password
    ports:
      - "7474:7474"   # Browser
      - "7687:7687"   # Bolt
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_plugins:/plugins
    networks:
      - labnet

  # DynamoDB Local (AWS DynamoDB-compatible local development database)
  dynamodb:
    image: amazon/dynamodb-local:latest
    container_name: dynamodb
    # Named volumes are root-owned when first created; DynamoDB Local needs write access.
    user: "0:0"
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-dbPath", "/home/dynamodblocal/data"]
    ports:
      - "8000:8000"
    volumes:
      - dynamodb_data:/home/dynamodblocal/data
    networks:
      - labnet
